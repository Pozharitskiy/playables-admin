services:
  mysql:
    image: mysql:8.0
    container_name: playables-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: playables
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/api/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: playables-clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./apps/api/scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
      - ./apps/api/scripts/clickhouse-config/users.d:/etc/clickhouse-server/users.d
    environment:
      CLICKHOUSE_DB: analytics
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: playables-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: "-js -m 8222"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: playables-api
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDR: ":8080"
      MYSQL_DSN: "root:password@tcp(mysql:3306)/playables?parseTime=true"
      CLICKHOUSE_DSN: "clickhouse://default:clickhouse@clickhouse:9000/analytics"
      NATS_URL: "nats://nats:4222"
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    container_name: playables-client
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
  clickhouse_data:
